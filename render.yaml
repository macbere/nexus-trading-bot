services:
  - type: web
    name: nexus-trading-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 main.py"
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOT_SYMBOL
        value: BTC/USDT:USDT
      - key: BOT_RISK_PCT
        value: "10.0"
      - key: BOT_LEVERAGE
        value: "1"
      - key: BOT_MAX_POS_USD
        value: "3.0"
      - key: BOT_MAX_DAILY_LOSS_USD
        value: "2.0"
      - key: BOT_TRADE_COOLDOWN_MIN
        value: "30"
      - key: BOT_MIN_ADX
        value: "25"
      - key: BOT_RSI_OS
        value: "30"
      - key: BOT_RSI_OB
        value: "70"
      - key: BOT_TP_PCT
        value: "2.5"
      - key: BOT_SL_PCT
        value: "1.5"
      - key: BOT_MAX_OPEN_POSITIONS
        value: "1"
      - key: BITGET_API_KEY
        sync: false
      - key: BITGET_SECRET
        sync: false
      - key: BITGET_PASSWORD
        sync: false
      - key: BITGET_DEMO
        value: "true"
      - key: BOT_ALLOW_LIVE_TRADING
        value: "false"
